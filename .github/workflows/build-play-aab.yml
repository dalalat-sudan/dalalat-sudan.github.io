name: Build Dalala Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack project
        run: |
          rm -rf dalala-build
          mkdir dalala-build
          unzip -q Dalala-Android-Play-v1.zip -d dalala-build

      - name: Restore upload keystore
        working-directory: dalala-build/dalala_android_play
        env:
          KEYSTORE_B64: ${{ secrets.DALALA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > app/dalala-upload-key.jks
      - name: Show keystore alias
        working-directory: dalala-build/dalala_android_play
        env:
          STORE_PASSWORD: ${{ secrets.DALALA_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore app/dalala-upload-key.jks -storepass "$STORE_PASSWORD" | grep "Alias name:"
      - name: Configure release signing
        working-directory: dalala-build/dalala_android_play
        env:
          STORE_PASSWORD: ${{ secrets.DALALA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DALALA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DALALA_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old="""    buildTypes {\n        release {\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n        }\n    }\n"""
          new="""    signingConfigs {\n        release {\n            storeFile file('dalala-upload-key.jks')\n            storePassword System.getenv('STORE_PASSWORD')\n            keyAlias System.getenv('KEY_ALIAS')\n            keyPassword System.getenv('KEY_PASSWORD')\n        }\n    }\n\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n        }\n    }\n"""
          if old not in s:
              raise SystemExit('Could not locate release block in app/build.gradle')
          p.write_text(s.replace(old,new))
          PY

      - name: Build signed AAB
        working-directory: dalala-build/dalala_android_play
        env:
          STORE_PASSWORD: ${{ secrets.DALALA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DALALA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DALALA_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Dalala-Play-AAB
          path: dalala-build/dalala_android_play/app/build/outputs/bundle/release/*.aab
          retention-days: 30
