name: Build Dalala Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack project
        run: |
          rm -rf dalala-build
          mkdir dalala-build
          unzip -q Dalala-Android-Play-v1.zip -d dalala-build

      - name: Restore upload keystore
        working-directory: dalala-build/dalala_android_play
        env:
          KEYSTORE_B64: ${{ secrets.DALALA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/dalala-upload-key.jks

      - name: Detect key alias
        working-directory: dalala-build/dalala_android_play
        env:
          STORE_PASSWORD: ${{ secrets.DALALA_KEYSTORE_PASSWORD }}
        run: |
          KEY_ALIAS="$(keytool -list -v -keystore app/dalala-upload-key.jks -storepass "$STORE_PASSWORD" | awk -F': ' '/Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"
          echo "::add-mask::$KEY_ALIAS"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed AAB
        working-directory: dalala-build/dalala_android_play
        env:
          STORE_PASSWORD: ${{ secrets.DALALA_KEYSTORE_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/dalala-upload-key.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$STORE_PASSWORD"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Dalala-Play-AAB
          path: dalala-build/dalala_android_play/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
