name: Build Dalala APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Find and unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'dalala_android_source_v1*.zip' -print -quit)
          echo "Using $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p extracted/dalala_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dalala-APK
          path: extracted/dalala_android/app/build/outputs/apk/debug/app-debug.apk
