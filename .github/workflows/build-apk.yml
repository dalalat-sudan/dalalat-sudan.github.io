name: Build Dalala APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Find and unzip Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'dalala_android_source_v1*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android ZIP file not found"
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android Gradle project not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          echo "Building project from: $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug --stacktrace
          else
            gradle -p "$PROJECT_DIR" assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "APK was not created"
            exit 1
          fi

          echo "APK found: $APK_FILE"
          cp "$APK_FILE" /tmp/Dalala-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dalala-APK
          path: /tmp/Dalala-debug.apk
